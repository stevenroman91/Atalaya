[project]
name = "atalaya"
version = "0.1.0"
description = "Servicio de vigilancia de seguridad para América Latina"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "rapidfuzz>=3.10",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "weasyprint>=62 ; python_version >= '3.11'",
    "python-docx>=1.1",
    "babel>=2.16",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
atalaya = "atalaya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
