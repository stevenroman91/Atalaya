{% extends "base.html" %}
{% block content %}
<div class="authwrap">
<div class="authbox">
  <div class="brand"><span class="brandmark">A</span>{{ t('app_name') }}</div>
  <p class="tagline">{{ t('tagline') }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/auth/login">
    <label>{{ t('email') }}<input type="email" name="email" required autofocus></label>
    <label>{{ t('password') }}<input type="password" name="password" required></label>
    <button type="submit" class="primary">{{ t('login') }}</button>
  </form>
  <p class="authfoot"><a href="/auth/reset">{{ t('forgot_password') }}</a></p>
  <p class="hint">{{ t('login_invite_hint') }}</p>
</div>
</div>
{% endblock %}
