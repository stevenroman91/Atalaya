{% extends "base.html" %}
{% block content %}
<div class="authbox">
  <h1>🗼 {{ t('app_name') }}</h1>
  <p class="muted">{{ t('tagline') }}</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/auth/login">
    <label>{{ t('email') }}<input type="email" name="email" required autofocus></label>
    <label>{{ t('password') }}<input type="password" name="password" required></label>
    <button type="submit" class="primary">{{ t('login') }}</button>
  </form>
  <p><a href="/auth/reset">{{ t('forgot_password') }}</a></p>
</div>
{% endblock %}
