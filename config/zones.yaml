# Zonas monitoreadas por Atalaya.
# daily: vigilancia diaria de alertas. weekly: vigilancia semanal / síntesis mensual.
# gn: parámetros de Google News RSS (hl/gl/ceid) por país.
# geo: [lat, lon] aproximado para el mapa (nivel ciudad; nunca se inventa una
#      dirección exacta — el resumen cita el lugar según las fuentes).

countries:
  MX:
    name: "México"
    lang: es
    gn: { hl: "es-419", gl: "MX", ceid: "MX:es-419" }
    daily: true
    weekly: false          # México tiene otro entregable, fuera de alcance
    zones:
      - id: mx-nacional
        name: "México (nacional)"
        query_terms: ["México"]
        geo: [23.6345, -102.5528]
      - id: mx-cdmx-roma-norte
        name: "CDMX — Roma Norte"
        parent: "Ciudad de México"
        query_terms: ["Roma Norte CDMX", "colonia Roma Norte"]
        geo: [19.4172, -99.1625]
      - id: mx-cdmx-polanco
        name: "CDMX — Polanco"
        parent: "Ciudad de México"
        query_terms: ["Polanco CDMX"]
        geo: [19.4326, -99.1994]
      - id: mx-cdmx-lomas
        name: "CDMX — Lomas de Chapultepec"
        parent: "Ciudad de México"
        query_terms: ["Lomas de Chapultepec"]
        geo: [19.4260, -99.2153]
      - id: mx-cdmx-benito-juarez
        name: "CDMX — Benito Juárez"
        parent: "Ciudad de México"
        query_terms: ["alcaldía Benito Juárez CDMX"]
        geo: [19.3727, -99.1564]
      - id: mx-cdmx-centro
        name: "CDMX — Centro"
        parent: "Ciudad de México"
        query_terms: ["Centro Histórico CDMX"]
        geo: [19.4326, -99.1332]
      - id: mx-cdmx-santa-fe
        name: "CDMX — Santa Fe"
        parent: "Ciudad de México"
        query_terms: ["Santa Fe CDMX"]
        geo: [19.3598, -99.2674]
      - id: mx-zacatecas
        name: "Zacatecas (capital)"
        query_terms: ["Zacatecas"]
        geo: [22.7709, -102.5832]
      - id: mx-juchitan
        name: "Oaxaca — Juchitán"
        query_terms: ["Juchitán Oaxaca", "Juchitán de Zaragoza"]
        geo: [16.4340, -95.0198]
      - id: mx-guaymas
        name: "Sonora — Guaymas"
        query_terms: ["Guaymas Sonora"]
        geo: [27.9179, -110.8989]

