# Fuentes de datos abiertas. Amplían la lista blanca sin sustituirla.
#
# REGLA (§4, idéntica a la de los flujos RSS): ninguna de estas URL se usa
# mientras no haya devuelto una respuesta parseable en una prueba real. El
# botón «Probar las API» del panel de administración lo comprueba desde
# producción y guarda el resultado; el colector ignora toda API sin prueba
# superada. El entorno de desarrollo no tiene salida a internet, así que no
# hay forma de que una URL entre aquí «porque parecía correcta».
#
#   enabled    ponerlo a false desactiva la API aunque esté probada
#   min_*      umbrales de pertinencia (por debajo es ruido operacional)

apis:
  gdelt:
    enabled: true
    kind: gdelt_doc
    name: "GDELT 2.0"
    url: "https://api.gdeltproject.org/api/v2/doc/doc"
    domain: "api.gdeltproject.org"
    max_records: 60
    timespan: "1d"
    # Solo aporta URLs: el texto lo extrae nuestro robot de la página real.
    #
    # Cómo nombra GDELT las lenguas. La primera prueba real devolvió un
    # boletín bursátil en inglés, así que el filtro hace falta; pero su
    # sintaxis exacta no se puede verificar desde el entorno de desarrollo.
    # Se deja aquí para poder corregirla sin tocar código. Vaciar el valor
    # (source_langs: {}) quita el filtro.
    source_langs:
      es: spanish
      pt: portuguese

  usgs:
    enabled: true
    kind: usgs_geojson
    name: "USGS (sismos)"
    url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson"
    domain: "earthquake.usgs.gov"
    # Por debajo de 4.0 un sismo no cambia la conducta de nadie sobre el
    # terreno; el boletín seguiría llenando el panel todos los días.
    min_magnitude: 4.0

  gdacs:
    enabled: true
    kind: gdacs_rss
    name: "GDACS"
    url: "https://www.gdacs.org/xml/rss.xml"
    domain: "gdacs.org"
    # GDACS publica también el nivel verde: sin impacto, sin decisión.
    min_level: orange

  reliefweb:
    # APAGADA. La prueba desde producción devolvió: «robots.txt del sitio
    # nos lo prohíbe». No se negocia y no se sortea — es la primera de
    # nuestras reglas no negociables, y vale igual para un endpoint de API
    # que para una portada.
    #
    # Si GEOS quiere esta fuente, la vía legítima existe y no pasa por el
    # código: pedir a OCHA una confirmación escrita de acceso programático.
    # Con esa confirmación del operador, se vuelve a poner en true.
    enabled: false
    kind: reliefweb_json
    name: "ReliefWeb (OCHA)"
    url: "https://api.reliefweb.int/v1/disasters"
    domain: "reliefweb.int"
    # `appname` es obligatorio en su API: identifica al cliente, igual que
    # nuestro User-Agent. No es una clave ni un secreto.
    appname: "atalaya-vigilancia"
    limit: 40

  nhc:
    enabled: true
    kind: nhc_rss
    name: "NOAA / NHC (ciclones)"
    # Pacífico oriental: es la cuenca que toca México y Centroamérica. El
    # Atlántico se añadirá si el operador confirma que aporta.
    url: "https://www.nhc.noaa.gov/index-ep.xml"
    domain: "nhc.noaa.gov"
