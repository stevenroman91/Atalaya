# Reglas de aceptación fuera de lista blanca (§4): un dominio externo solo se
# acepta si parece un medio de prensa identificable Y el evento ya está
# corroborado por al menos una fuente de la lista blanca. Estos umbrales los
# usa el detector de granjas de contenido.
off_whitelist:
  allow_corroborated: true
  reject_signals:
    max_domain_age_days_suspicious: 180   # dominios recientes que imitan medios
    require_known_tld: true
  blocked_domains: []                     # lista negra manual, editable desde admin
