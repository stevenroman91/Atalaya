# Lista blanca de fuentes de Atalaya.
#
# Campos por fuente:
#   name            Nombre del medio
#   domain          Dominio canónico (sin www)
#   origin          País de origen (ISO-2) — puede diferir de los países cubiertos
#   covers          Lista de países (ISO-2) para los que esta fuente es válida.
#                   "*" = todos los países del perímetro.
#   lang            Idioma principal (es/pt/en)
#   type            independiente | estatal | internacional
#   rss             URL de flujo RSS *verificada*. null = desconocida: el colector
#                   intenta autodescubrirla (<link rel="alternate">) en runtime y
#                   la persiste en la base; NUNCA se inventa una URL a mano.
#   section_url     Para medios "fuera de país": sección regional a privilegiar.
#                   El colector además filtra por entidades geográficas del texto.
#
# Regla §4: un medio "estatal" lleva el tag «medio estatal — contrastar» y nunca
# sustenta una alerta por sí solo. Dos fuentes estatales no cuentan como
# independientes entre sí para la recurrencia.

sources:
  # ── Internacionales / regionales ──────────────────────────────────────────
  - { name: "Infobae",            domain: "infobae.com",         origin: AR, covers: ["*"], lang: es, type: internacional, rss: null }
  - { name: "BBC Mundo",          domain: "bbc.com",             origin: GB, covers: ["*"], lang: es, type: internacional, rss: null,
      section_url: "https://www.bbc.com/mundo" }
  - { name: "El País América",    domain: "elpais.com",          origin: ES, covers: ["*"], lang: es, type: internacional, rss: null,
      section_url: "https://elpais.com/america/" }
  - { name: "Bloomberg Línea",    domain: "bloomberglinea.com",  origin: US, covers: ["*"], lang: es, type: internacional, rss: null }
  - { name: "Forbes (ediciones locales)", domain: "forbes.com.mx", origin: MX, covers: ["*"], lang: es, type: internacional, rss: null }
  - { name: "El Economista",      domain: "eleconomista.com.mx", origin: MX, covers: ["*"], lang: es, type: internacional, rss: null }
  - { name: "LatinUS",            domain: "latinus.us",          origin: US, covers: ["*"], lang: es, type: internacional, rss: null }
  - { name: "Prensa Latina",      domain: "prensa-latina.cu",    origin: CU, covers: ["*"], lang: es, type: estatal, rss: null }
  - { name: "teleSUR",            domain: "telesurtv.net",       origin: VE, covers: ["*"], lang: es, type: estatal, rss: null }

  # ── México ────────────────────────────────────────────────────────────────
