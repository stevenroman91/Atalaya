# Horarios de los jobs (interpretados en la zona horaria indicada).
# ESTOS valores son los que aplica el planificador interno del servicio web
# (jobs/scheduler.py): son la fuente de verdad. Los `railway/cron-*.json`
# repiten los mismos horarios en UTC para el día en que existan servicios de
# cron; si se crean, los dos mecanismos no se duplican — el primero que
# corre satisface el horario. Cambiar uno sin el otro solo adelanta o
# retrasa la colecta, nunca la duplica.
daily:
  cron: "0 3,6,12 * * *"       # 03:00, 06:00 y 12:00 America/Mexico_City
                               # = 09:00, 12:00 y 18:00 UTC
  timezone: "America/Mexico_City"
  window_hours: 24
  overlap_hours: 2             # ventana deslizante 24h + 2h de solape
weekly:
  cron: "0 7 * * 5"            # viernes 07:00
  timezone: "America/Mexico_City"
  window_days: 7
  overlap_hours: 6
monthly:
  cron: "0 7 1 * *"            # día 1 a las 07:00
  timezone: "America/Mexico_City"
# El planificador interno del servicio web. Apagable sin desplegar con
# ATALAYA_SCHEDULER=off — por ejemplo el día que existan servicios de cron
# de Railway, o para parar las colectas sin parar el sitio.
scheduler:
  enabled: true
  poll_seconds: 60
collector:
  request_delay_seconds: 1.5   # cortesía entre peticiones al mismo host
  per_host_delay_seconds:      # excepciones (infraestructuras de gran capacidad)
    news.google.com: 0.3
    # GDELT nos devolvió 429 repetidamente durante las pruebas manuales: su
    # API es gratuita y limita por IP sobre una ventana, no por intervalo
    # entre peticiones. 30 s hacen cinco minutos para los diez países una
    # vez al día — invisible para un cron, decisivo para no ser expulsados.
    api.gdeltproject.org: 30.0
  timeout_seconds: 12         # los sitios hostiles que no responden cuestan un timeout completo
  user_agent: "AtalayaBot/1.0 (+vigilancia de seguridad; contacto: admin)"
  max_articles_per_feed: 50
  # Leer la portada de los medios que no publican ningún flujo. Encendido
  # tras medirlo con «Diagnosticar todas» en el panel: 14 medios tienen
  # portada aprovechable (El Heraldo 82 artículos pertinentes, La Tribuna
  # 62, Proceso 51, La Nación PY 51, El Economista 50…). Apagarlo aquí si
  # alguna vez cuesta más de lo que aporta.
  home_scrape: true
  parallel_workers: 4          # países en paralelo (1 = secuencial); la cortesía por host se mantiene
  source_failure_alert_days: 3 # fuente inalcanzable N días seguidos → visible en admin
  # Cuánto se guarda la traza de los artículos descartados. Sirve al
  # analista para discutir los filtros de estos días, no para siempre.
  reject_retention_days: 30

# Clasificador de pertinencia (§5.5 bis). Responde a dos preguntas —¿es un
# hecho de seguridad? ¿de qué tipo?— y NO redacta nada: los resúmenes siguen
# siendo estrictamente extractivos. Sin ANTHROPIC_API_KEY no se activa y el
# pipeline conserva la clasificación léxica.
classifier:
  enabled: true
  model: "claude-opus-5"
  # Techo por colecta: protege la factura si un día el filtrado aguas arriba
  # falla y llegan mil clusters en vez de treinta.
  max_events: 120
  # Por debajo de esta confianza el veredicto NO se aplica: el evento se
  # marca y aparece en «Clasificación dudosa», al pie del panel, para que
  # el analista decida. Alto a propósito: un modelo que se equivoca con
  # aplomo cuesta más caro que uno que duda en voz alta.
  confidence_threshold: 0.9
